name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Lockfile-only and fixture-only changes have nothing to review.
    paths-ignore:
      - "uv.lock"
      - "tests/fixtures/**"

# A new push cancels the review still running on the previous commit of the same pull request.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # One agent, one pass, an inline prompt. The multi-agent review plugin cost one to five
      # dollars per review and needed skill, gh api and foreground-agent rules before it would
      # run in a non-interactive job; this shape needs none of them. CLAUDE.md is the rubric.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a4f54ef2c58884867281bd8e2f8d63352ad019a9 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request in one pass. Read CLAUDE.md first: its Invariants section
            is the rubric, and its Working section says what done means. Read the diff with
            `gh pr diff` and the description with `gh pr view`. The pull request is already
            checked out in the working directory, so read any file with Read and search with
            Grep; do not fetch branches or file contents another way, and do not run scripts.

            Look for, in this order:
            1. Invariant violations: entitlement filtering anywhere but SQL, retrieval that
               returns chunk text without citations, identity taken from tool arguments or
               message text, copy implying real protected data was used, claims of Docker
               organisation-level governance, versions written from memory instead of checked.
            2. Bugs in the changed code: wrong results, unhandled failure at a system boundary,
               a test that cannot fail, a claim in a docstring or comment the code does not keep.
            3. Documentation that the code does not back: a README or ADR statement a reader
               could not verify against the repository.

            Skip style and formatting; ruff and mypy run in a separate job. Do not run tests or
            build anything; the test job does that. Be concise: no filler, no praise.

            Use an inline comment for each specific finding, with a suggestion block when a
            small change fixes it entirely. If claude[bot] has already commented on this pull
            request, review only what changed since that comment and keep the summary to that.
            To see earlier comments run `gh pr view --comments`; do not use gh api, which is
            not allowed. Run `gh pr diff` on its own: do not redirect or pipe its output, since
            a command with several parts is refused; for a long diff, Read the changed files.

            Always finish by posting exactly one top-level comment with `gh pr comment` whose
            first line is "## Code review", followed by the findings in brief, or by
            "No issues found. Checked for bugs, CLAUDE.md invariants and documentation
            accuracy." if there are none. The check fails if that comment is missing.
          claude_args: |
            --model claude-sonnet-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      # The action reports success when it skips and when the reviewer stops early, so a green
      # check proved nothing. The prompt makes a finished review always post a "## Code review"
      # comment, so its absence means nothing reviewed this change. Kept inline so the action's
      # "identical to the default branch" validation covers it.
      - name: Verify the review was posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -s "$EXECUTION_FILE" ]; then
            echo "::warning title=Pull request not reviewed::The review action did not run. This happens when this workflow file differs from the default branch. Nothing reviewed this pull request."
            exit 0
          fi

          result=$(jq -c -s 'flatten | map(select(.type == "result")) | last // {}' "$EXECUTION_FILE")
          turns=$(jq -r '.num_turns // "?"' <<<"$result")
          cost=$(jq -r '.total_cost_usd // "?"' <<<"$result")
          denials=$(jq -r '(.permission_denials // []) | length' <<<"$result")
          echo "review run: turns=$turns cost_usd=$cost denials=$denials"
          jq -r '(.permission_denials // [])[] | "denied: \(.tool_name) \((.tool_input.command // "") | .[0:80])"' <<<"$result"

          summaries=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == "claude[bot]" and (.body | startswith("## Code review"))) | .id' | wc -l | tr -d ' ')
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq '.[] | select(.user.login == "claude[bot]") | .id' | wc -l | tr -d ' ')
          if [ "$summaries" -eq 0 ]; then
            echo "::error title=Pull request not reviewed::The reviewer ran (turns=$turns, denials=$denials, inline comments=$inline) but posted no '## Code review' summary. Nothing reviewed this pull request."
            exit 1
          fi
          echo "review output on the pull request: summaries=$summaries inline=$inline"
