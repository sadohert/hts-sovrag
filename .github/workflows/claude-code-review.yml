name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Lockfile-only and fixture-only changes have nothing to review.
    paths-ignore:
      - "uv.lock"
      - "tests/fixtures/**"

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The review reads CLAUDE.md from main, so the invariants listed there are the rubric.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Everything the plugin's own allowed-tools lists. Its first step is a subagent that
          # runs `gh pr view`; with only the inline comment tool allowed that call was denied,
          # the reviewer stopped after a few turns, and the job still reported success.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"

      # The action reports success when it skips and when the reviewer gives up, so a green
      # check proved nothing. With --comment a finished review always posts, either findings
      # or "No issues found", so no post from claude[bot] means nothing reviewed this change.
      # Kept inline so the action's "identical to the default branch" validation covers it.
      - name: Verify the review was posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -s "$EXECUTION_FILE" ]; then
            echo "::warning title=Pull request not reviewed::The review action did not run. This happens when this workflow file differs from the default branch. Nothing reviewed this pull request."
            exit 0
          fi

          result=$(jq -c -s 'flatten | map(select(.type == "result")) | last // {}' "$EXECUTION_FILE")
          turns=$(jq -r '.num_turns // "?"' <<<"$result")
          cost=$(jq -r '.total_cost_usd // "?"' <<<"$result")
          denials=$(jq -r '(.permission_denials // []) | length' <<<"$result")
          echo "review run: turns=$turns cost_usd=$cost denials=$denials"
          jq -r '(.permission_denials // [])[] | "denied: \(.tool_name) \((.tool_input.command // "") | .[0:80])"' <<<"$result"

          count() {
            gh api "$1" --paginate --jq '.[] | select(.user.login == "claude[bot]") | .id' | wc -l
          }
          posted=$(( $(count "repos/$REPO/issues/$PR/comments") + $(count "repos/$REPO/pulls/$PR/comments") + $(count "repos/$REPO/pulls/$PR/reviews") ))
          if [ "$posted" -eq 0 ]; then
            echo "::error title=Pull request not reviewed::The reviewer ran (turns=$turns, denials=$denials) but posted nothing. Either it could not read the pull request, or it judged the change too trivial to review. Nothing reviewed this pull request."
            exit 1
          fi
          echo "review output on the pull request: $posted"
