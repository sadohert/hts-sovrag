name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sovrag
          POSTGRES_PASSWORD: sovrag
          POSTGRES_DB: sovrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sovrag -d sovrag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sovrag:sovrag@localhost:5432/sovrag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      # Retrieval eval and leak tests against data/fixture (committed index) go here.
