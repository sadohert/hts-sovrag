name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: sovrag
          POSTGRES_PASSWORD: sovrag
          POSTGRES_DB: sovrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sovrag -d sovrag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sovrag:sovrag@localhost:5432/sovrag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run sovrag eval load-fixture
      - run: uv run sovrag eval retrieval --check --out /tmp/retrieval.json
      - run: uv run sovrag eval leak --check --out /tmp/leak.json
