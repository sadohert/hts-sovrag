# sovrag corpus manifest
# All documents are public, published under the Open Government Licence - Canada.
# classification is assigned synthetically by rule from doc_type at ingest time (see README); it is not in this file.
# Generated 2026-09-15. Notes:
#   - CSE (Communications Security Establishment): no Departmental Plan or Departmental Results Report could be located
#     for any year. CSE is not listed on either TBS index (DP or DRR), cse-cst.gc.ca has no DP/DRR pages (its Reports page
#     lists only annual reports, ATIP, DSDS, internal audit, etc.; every guessed URL returned 404), publications.gc.ca has
#     no CSE DP/DRR record, and the Wayback CDX index shows no such path ever existed on cse-cst.gc.ca. All 4 CSE
#     documents are therefore omitted.
#   - Public Safety Canada publishes its DPs/DRRs on publicsafety.gc.ca (not www.canada.ca); those are the only English
#     HTML versions and are used here. Each is a complete single-page report.
#   - The Standard on Security Screening (tbs-sct id=28115) was archived 2025-01-06 and replaced by the Directive on
#     Security Screening (id=32805); the current Directive is listed instead of the archived Standard.
#   - Verification: publicsafety.gc.ca, tbs-sct.canada.ca and oag-bvg.gc.ca URLs were curl-verified (HTTP 200 + title).
#     www.canada.ca refused every curl/Python request from this machine (Akamai: HTTP/2 INTERNAL_ERROR, HTTP/1.1 hangs),
#     so www.canada.ca URLs were verified by fetching each page and checking its <title> through a browser-origin fetch;
#     404s were observed and excluded during that process. Re-run a curl sweep from another network before ingest.
#   - tbs-sct.canada.ca/pol/ pages return "Request Rejected" (HTTP 200) to a bare "Mozilla/5.0" UA; use a full
#     browser User-Agent string when fetching them.
