# Loki single-binary for the local observability profile (ADR 0016). Filesystem storage on the
# loki-data volume; no authentication because the port is not published to the host.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  # Flush chunks within minutes. The live check showed backlog streams still absent from
  # queries with only the querier lookback at 0s; with these values every stream was queryable
  # ninety seconds after a fresh start. Also bounds memory and moves history to the store.
  chunk_idle_period: 1m
  max_chunk_age: 5m
  flush_check_period: 10s

querier:
  # Ask the ingester for every range, not only the last 3h, so entries still in memory are
  # not hidden from a query over older days.
  query_ingesters_within: 0s

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  allow_structured_metadata: true
  # The audit file predates the profile; accept its whole history on first start.
  reject_old_samples: false
  # Keep the label set to job, event, principal, refused (ADR 0016).
  discover_service_name: []
