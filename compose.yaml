# sovrag: the whole stack. `docker compose up -d` is the runbook.
# Profiles: (default) postgres + app on Docker Model Runner; vllm = GPU serving comparison; mcp = MCP server.

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: sovrag
      POSTGRES_PASSWORD: sovrag
      POSTGRES_DB: sovrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovrag -d sovrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sovrag:sovrag@postgres:5432/sovrag
      EMBED_DIM: "1024"
      AUDIT_LOG_PATH: /app/audit/audit.jsonl
    volumes:
      - audit:/app/audit
    models:
      llm:
        endpoint_var: LLM_BASE_URL
        model_var: LLM_MODEL
      embed:
        endpoint_var: EMBED_BASE_URL
        model_var: EMBED_MODEL

  vllm:
    profiles: [vllm]
    image: vllm/vllm-openai:latest
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen3.5-9B}", "--dtype", "bfloat16"]
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # The MCP server the Mattermost Agents plugin calls (ADR 0009). Same image as app, different
  # command. MCP_IDENTITY has no default: "static" binds PRINCIPAL at startup; "mattermost"
  # binds each tool call to the user the plugin names, after the plugin proves itself with
  # MCP_SHARED_SECRET. MCP_ALLOWED_HOSTS must include the name the plugin dials.
  mcp:
    profiles: [mcp]
    build:
      context: .
    command: ["sovrag", "serve-mcp", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sovrag:sovrag@postgres:5432/sovrag
      AUDIT_LOG_PATH: /app/audit/audit.jsonl
      MCP_IDENTITY: ${MCP_IDENTITY:?set MCP_IDENTITY to static or mattermost}
      PRINCIPAL: ${PRINCIPAL:-}
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp:*,localhost:*}
      MATTERMOST_URL: ${MATTERMOST_URL:-}
      MATTERMOST_BOT_TOKEN: ${MATTERMOST_BOT_TOKEN:-}
    ports:
      - "8001:8001"
    volumes:
      - audit:/app/audit
    models:
      llm:
        endpoint_var: LLM_BASE_URL
        model_var: LLM_MODEL
      embed:
        endpoint_var: EMBED_BASE_URL
        model_var: EMBED_MODEL

models:
  llm:
    model: ai/qwen3.5:9b-q4_K_M
    context_size: 8192
  embed:
    model: hf.co/gpustack/bge-m3-gguf:Q8_0
    context_size: 8192
    # Embedding inputs are capped at 512 tokens per call by llama.cpp's physical batch
    # (n_ubatch). Model Runner passes --batch-size through but not --ubatch-size, and
    # llama.cpp clamps n_batch down to n_ubatch for embeddings, so the limit cannot be
    # raised here. The ingest pipeline keeps every input under it (see ADR 0005).

volumes:
  pgdata: {}
  audit: {}
