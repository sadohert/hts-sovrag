[project]
name = "sovrag"
version = "0.1.0"
description = "Reference implementation of permissions-aware RAG over Canadian federal public documents."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
dependencies = [
  "openai>=3.14",
  "psycopg[binary]>=3.3",
  "pgvector>=0.5",
  "fastapi>=0.141",
  "uvicorn[standard]>=0.53",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "beautifulsoup4>=4.15",
  "lxml>=6.1",
  "typer>=0.27",
  "tiktoken>=0.14",
  "curl-cffi>=0.16.3",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=6.0"]
rerank = ["sentence-transformers>=6.0"]
mcp = ["mcp>=2.2"]

[project.scripts]
sovrag = "sovrag.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
  "mypy>=2.3",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sovrag"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "eval", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# real page titles contain typographic apostrophes
"tests/*" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
