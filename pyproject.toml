[project]
name = "sovrag"
version = "0.1.0"
description = "Reference implementation of permissions-aware RAG over Canadian federal public documents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "openai>=1.50",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "typer>=0.12",
  "tiktoken>=0.7",
  "curl-cffi>=0.16.3",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=3.0"]
rerank = ["sentence-transformers>=3.0"]
mcp = ["mcp>=1.2"]

[project.scripts]
sovrag = "sovrag.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sovrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# real page titles contain typographic apostrophes
"tests/*" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
